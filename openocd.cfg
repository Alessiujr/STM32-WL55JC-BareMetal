# NUCLEO-WL55JC: ST-LINK over SWD, Cortex-M4 only.
source [find interface/stlink.cfg]
transport select hla_swd
set DUAL_CORE 0
source [find target/stm32wlx.cfg]

# The upstream reset-init event increases MSI to 24 MHz for programming.
# Keep reset-time clocks for this learning project, even after reset init.
stm32wlx.cpu0 configure -event reset-init {}
adapter speed 500
